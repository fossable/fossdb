[package]
name = "fossdb-worker"
description = "FossDB package analysis worker"
version.workspace = true
edition.workspace = true
authors = ["cilki"]
repository = "https://github.com/fossable/fossdb/"
license = "Unlicense"

[features]
default = ["analysis-source", "analysis-binary"]
analysis-source = ["dep:flate2", "dep:tar", "dep:zip", "dep:bzip2"]
analysis-binary = ["dep:goblin"]

[dependencies]
# Workspace dependencies
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

# Core types
fossdb = { path = "../fossdb", version = "0.0.1" }

async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "stream"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
tempfile = "3"
regex = "1.0"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"

# Source analysis
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "2", optional = true }
bzip2 = { version = "0.4", optional = true }

# Binary analysis
goblin = { version = "0.9", optional = true }
