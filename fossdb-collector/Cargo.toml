[package]
name = "fossdb-collector"
description = "FossDB package collector"
version.workspace = true
edition.workspace = true
authors = ["cilki"]
repository = "https://github.com/fossable/fossdb/"
license = "Unlicense"

[features]
default = ["collector-rust", "collector-nixpkgs"]
collector-rust = ["dep:crates_io_api"]
collector-nixpkgs = []
collector-libraries-io = []

[dependencies]
# Workspace dependencies
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

# Core types
fossdb = { path = "../fossdb", version = "0.0.1" }

async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
governor = "0.10.4"

# Rust collector
crates_io_api = { version = "0.12", default-features = false, features = ["rustls"], optional = true }
